name: Deploy Web

# Build Flutter web (custom domain root) + React admin, lalu deploy ke gh-pages.
# Flutter dibangun dengan --base-href / agar cocok untuk domain root
# (dokterbisnis.web.id), BUKAN subpath github.io/kasirgo/.
# apk/ dan file lain yang sudah ada di gh-pages dipertahankan (keep_files).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: kasirgo
        run: flutter pub get

      - name: Build Flutter web (base root domain)
        working-directory: kasirgo
        run: flutter build web --release --base-href /

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React admin
        working-directory: kasirgo-admin
        run: |
          npm ci
          # Base /admin/ agar cocok saat di-host di subpath gh-pages
          npm run build -- --base=/admin/

      - name: Stage Flutter web + React admin ke ./deploy
        run: |
          rm -rf deploy
          mkdir -p deploy/admin deploy/app

          # Flutter web di root deploy (path /, untuk custom domain)
          cp -r kasirgo/build/web/* deploy/

          # React admin di subpath /admin/
          cp -r kasirgo-admin/dist/* deploy/admin/

          # Sinkronkan version.json dari pubspec agar web mencerminkan versi app terbaru
          VERSION=$(grep '^version:' kasirgo/pubspec.yaml | sed 's/version: *//')
          VER_NAME="${VERSION%%+*}"
          BUILD_NUM="${VERSION##*+}"
          printf '{"app_name":"kasirgo","version":"%s","build_number":"%s","package_name":"kasirgo"}\n' "$VER_NAME" "$BUILD_NUM" > deploy/version.json
          cp deploy/version.json deploy/app/version.json

          touch deploy/.nojekyll
          echo "Deployed: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > deploy/.deployed-at
          echo "Deploy contents (top-level):"
          ls deploy
          echo "Admin contents:"
          ls deploy/admin | head -n 30

      - name: Deploy ke gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          keep_files: true
          publish_branch: gh-pages
