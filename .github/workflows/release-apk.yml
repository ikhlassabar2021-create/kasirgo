name: Release APK

# Build APK rilis di CI (BUKAN di mesin pengembang/sandbox).
# Jalankan: push tag v* atau picu manual dari tab Actions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kasirgo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Obfuscate Dart + split per ABI (target: tiap APK < 10MB).
      # WAJIB sebelum publish: pasang keystore rilis sendiri (lihat
      # docs/RELEASE.md -- signingConfig debug hanya untuk uji coba).
      - run: >
          flutter build apk --release --split-per-abi --obfuscate
          --split-debug-info=build/debug-info

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            kasirgo/build/app/outputs/flutter-apk/*-release.apk
            kasirgo/build/debug-info/
